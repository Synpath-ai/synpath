name: tests

on:
  push:
    branches: [main, codex/order-lifecycle-storage]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # An editable install builds the Rust core (synpath._core) with maturin.
      - run: pip install -e ".[dev]"
      - name: Tests on the Rust core
        run: pytest -q
      - name: Tests on the pure-Python twins
        run: pytest -q
        env:
          SYNPATH_PURE_PYTHON: "1"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p synpath-core --all-targets -- -D warnings
      - run: cargo test -p synpath-core
      - name: The sdist builds and carries what its metadata names
        run: |
          pipx run maturin sdist --out dist
          tar tzf dist/*.tar.gz | grep -q '/LICENSE$' || { echo "LICENSE missing from the sdist; PyPI refuses it"; exit 1; }
      - name: Without Rust, installing the sdist says to install Rust
        run: |
          python3 -m venv /tmp/norust
          out=$(env -i HOME=/tmp/norust-home PATH=/usr/bin:/bin /tmp/norust/bin/python -m pip install --no-deps dist/*.tar.gz 2>&1 || true)
          echo "$out" | tail -20
          echo "$out" | grep -q "sh.rustup.rs" || { echo "the install-Rust message did not appear"; exit 1; }


  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: synpath_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synpath_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install -e ".[dev,postgres]"
      - name: PostgreSQL journal, recovery and mocked venue contracts
        run: pytest -q tests/test_postgres_storage.py
        env:
          SYNPATH_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/synpath_test
